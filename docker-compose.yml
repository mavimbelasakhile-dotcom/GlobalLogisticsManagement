version: '3.8'

services:
  sql-server-db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sql-server-db
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=YourStrong@Passw0rd
    ports:
      - "1433:1433"
    volumes:
      - sqldata:/var/opt/mssql
    networks:
      - glms-network

  glms-backend-api:
    build:
      context: ../GlobalLogisticsManagementSystemAPI
      dockerfile: GlobalLogisticsManagementSystemAPI/Dockerfile
    container_name: glms-backend-api
    ports:
      - "5110:80"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=sql-server-db;Database=GlobalLogisticsManagementDb;User Id=sa;Password=YourStrong@Passw0rd;TrustServerCertificate=true
    depends_on:
      - sql-server-db
    networks:
      - glms-network

  glms-frontend-web:
    build:
      context: .
      dockerfile: GlobalLogisticsManagementUI/Dockerfile
    container_name: glms-frontend-web
    ports:
      - "5053:80"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ApiSettings__BaseUrl=http://glms-backend-api:80/
    depends_on:
      - glms-backend-api
    networks:
      - glms-network

networks:
  glms-network:
    driver: bridge

volumes:
  sqldata:
