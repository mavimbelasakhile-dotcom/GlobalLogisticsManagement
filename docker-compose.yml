version: '3.8'

services:
  glms-api:
    build:
      context: ../GlobalLogisticsManagementSystemAPI
      dockerfile: GlobalLogisticsManagementSystemAPI/Dockerfile
    ports:
      - "5110:80"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=sqlserver;Database=GlobalLogisticsManagementDb;User Id=sa;Password=YourStrong@Passw0rd;TrustServerCertificate=true
    depends_on:
      - sqlserver

  glms-ui:
    build:
      context: .
      dockerfile: GlobalLogisticsManagementUI/Dockerfile
    ports:
      - "5053:80"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ApiSettings__BaseUrl=http://glms-api:80/
    depends_on:
      - glms-api

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=YourStrong@Passw0rd
    ports:
      - "1433:1433"
    volumes:
      - sqldata:/var/opt/mssql

volumes:
  sqldata:
